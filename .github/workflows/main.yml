name: THENUVA X MD - WasenderAPI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: thenuva-x-md
  cancel-in-progress: false

jobs:
  test-wasender:
    name: Test WasenderAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test WasenderAPI via Node.js
        uses: actions/github-script@v7
        env:
          WASENDER_API_KEY: \${{ secrets.WASENDER_API_KEY }}
          TEST_PHONE: \${{ secrets.TEST_PHONE }}
        with:
          script: |
            const { WASENDER_API_KEY, TEST_PHONE } = process.env;

            if (!WASENDER_API_KEY || !TEST_PHONE) {
              core.setFailed("Required secrets (WASENDER_API_KEY or TEST_PHONE) are missing!");
              return;
            }

            try {
              const response = await fetch(
                'https://www.wasenderapi.com/api/send-message',
                {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${WASENDER_API_KEY}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    to: TEST_PHONE,
                    text: 'THENUVA X MD - WasenderAPI test message.'
                  }),
                  signal: AbortSignal.timeout(30000)
                }
              );

              const body = await response.text();
              console.log('HTTP status:', response.status);

              if (!response.ok) {
                core.setFailed(`WasenderAPI request failed: ${body.slice(0, 1000)}`);
                return;
              }

              console.log('API accepted the request.');
              console.log(body.slice(0, 1000));
            } catch (error) {
              core.setFailed(`Request failed: ${error.message}`);
            }
