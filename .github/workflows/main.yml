name: THENUVA X MD - WasenderAPI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: thenuva-x-md
  cancel-in-progress: false

jobs:
  test-wasender:
    name: Test WasenderAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Secrets
        env:
          WASENDER_API_KEY: ${{ secrets.WASENDER_API_KEY }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
        run: |
          if [ -z "$WASENDER_API_KEY" ]; then
            echo "::error::WASENDER_API_KEY secret is missing"
            exit 1
          fi

          if [ -z "$TEST_PHONE" ]; then
            echo "::error::TEST_PHONE secret is missing"
            exit 1
          fi

          echo "Secrets are configured successfully."

      - name: Test WasenderAPI
        uses: actions/github-script@v7
        env:
          WASENDER_API_KEY: ${{ secrets.WASENDER_API_KEY }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
        with:
          script: |
            const token = process.env.WASENDER_API_KEY;
            const phone = process.env.TEST_PHONE;

            const response = await fetch(
              'https://www.wasenderapi.com/api/send-message',
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                  Accept: 'application/json'
                },
                body: JSON.stringify({
                  to: phone,
                  text: 'THENUVA X MD - WasenderAPI test message.'
                }),
                signal: AbortSignal.timeout(30000)
              }
            );

            const result = await response.text();

            console.log('HTTP status:', response.status);

            if (!response.ok) {
              core.setFailed(
                `WasenderAPI error (${response.status}): ${result.slice(0, 1000)}`
              );
              return;
            }

            console.log('API accepted the request.');
            console.log(result.slice(0, 1000));
