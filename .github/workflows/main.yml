name: THENUVA X MD - WasenderAPI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: thenuva-x-md
  cancel-in-progress: false

jobs:
  test-wasender:
    name: Test WasenderAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Secrets
        env:
          WASENDER_API_KEY: ${{ secrets.WASENDER_API_KEY }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
        run: |
          if [ -z "$WASENDER_API_KEY" ]; then
            echo "::error::WASENDER_API_KEY secret is missing"
            exit 1
          fi

          if [ -z "$TEST_PHONE" ]; then
            echo "::error::TEST_PHONE secret is missing"
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Send Test WhatsApp Message
        uses: actions/github-script@v7
        env:
          WASENDER_API_KEY: ${{ secrets.WASENDER_API_KEY }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
        with:
          script: |
            const { WASENDER_API_KEY, TEST_PHONE } = process.env;

            try {
              const response = await fetch(
                'https://www.wasenderapi.com/api/send-message',
                {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${WASENDER_API_KEY}`,
                    'Content-Type': 'application/json',
                    Accept: 'application/json'
                  },
                  body: JSON.stringify({
                    to: TEST_PHONE,
                    text: 'THENUVA X MD - WasenderAPI test message.'
                  }),
                  signal: AbortSignal.timeout(30000)
                }
              );

              const body = await response.text();

              console.log('HTTP status:', response.status);

              if (!response.ok) {
                core.setFailed(
                  `WasenderAPI request failed (HTTP ${response.status}): ${body.slice(0, 1000)}`
                );
                return;
              }

              console.log('WasenderAPI accepted the request.');
              console.log(body.slice(0, 1000));

            } catch (error) {
              core.setFailed(`Request failed: ${error.message}`);
            }
